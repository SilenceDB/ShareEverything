# HTTPS 证书访问名配置
# ---------------------------------------------------------------------------
# 每行写一个域名或 IP，写进证书的 SAN；浏览器用哪个地址访问，就必须有哪个名字。
# 以 # 开头的是注释，空行忽略，行尾也可以用 # 加备注。
#
#   se.internal          # 内网域名（客户机配 hosts 或内网 DNS 指到服务器）
#   172.19.42.200        # 固定 IP
#
# 改完这个文件，重新执行一次 tools/gen-cert.mjs 就会按新内容重签证书。
# 注意：重签会换掉证书指纹，客户机需要重新导入一次 certs/server.crt。
#
# ---------------------------------------------------------------------------
# 下面三项由脚本自动加入，不用写、写了也不会重复：
#   127.0.0.1    localhost    ::1
# 所以本机永远可以直接访问 https://localhost:3000 ，不必输入 IP。
#
# 本文件留空（或全是注释）时：自动收集本机所有 IPv4 与主机名，
# 适合临时用 IP 直接访问的场合。只要这里写了任意一项，就以本文件为准，
# 不再自动收集网卡地址 —— 写进来的 IP 默认是固定的，没必要每次重签。
# 需要「配置 + 自动收集网卡 IP」两者都要，执行时加 --auto-ip。
# ---------------------------------------------------------------------------

# se.internal
# 172.19.42.200
